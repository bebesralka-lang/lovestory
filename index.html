<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎵 Тест музыки</title>
</head>
<body>
    <h1>🎵 Тест музыки</h1>
    <button id="testBtn">▶️ Нажми меня</button>

    <script>
        const btn = document.getElementById('testBtn');
        let audio = null;

        btn.addEventListener('click', function() {
            if (!audio) {
                audio = new Audio('music.mp3');
                audio.volume = 0.8;
            }
            audio.play().then(() => {
                alert('✅ Музыка играет!');
            }).catch((e) => {
                alert('❌ Ошибка: ' + e.message);
            });
        });
    </script>
</body>
</html>
